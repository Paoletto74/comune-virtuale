# =============================================================================
# NEWSPAPER VISUAL IDENTITY & ART DIRECTION MAIN CATALOG v1
# =============================================================================
# DECISIONE APPROVATA: linguaggio editoriale quotidiano come grammatica visiva comune
# NEWSPAPER-INSPIRED — NON copiare giornali reali — identita originale
# V1: proposta artistica — NO frontend runtime, NO asset definitivi, NO font/palette finali
# Integra con ui_main_v1 (design system) e visual_main_v1 (assets) — NON li modifica
# =============================================================================

catalogId: newspaper_v1
version: "1.0.0"
schemaVersion: 1
visualDirectionVersion: newspaper_v1

linkedSystems:
  uiMain: ui_main_v1
  visualMain: visual_main_v1
  frontend: frontend_ui_v1
  profile: profile_main_v1
  notification: notification_main_v1
  eventSystem: event_main_v1
  adminContentStudio: admin_content_studio_v1
  timeSystem: time_main_v1
  gazzetta: frontend_ui_v1/gazzetta.yaml

principles:
  - Newspaper-inspired visual language — NON simulazione fisica cartacea
  - NO skeuomorphism — VISUAL LANGUAGE not PHYSICAL SIMULATION
  - NO copia layout/logo/font/palette/marchi giornali reali
  - Classic Newspaper + Modern Digital Product + Game UI
  - Editorial content vs Game action — devono convivere senza confondersi
  - Gameplay NON dipende da immagini specifiche
  - ui_main_v1 = source of truth component primitives e base tokens
  - visual_main_v1 = source of truth assets e visualAssetId
  - Content system = source of truth testi headline/article
  - AI Draft -> Validation -> Approval -> Publish — MAI publish diretto


# =============================================================================
# ACCESSIBILITY — newspaper aesthetic must not compromise a11y
# =============================================================================

Accessibility:
  DECISIONE APPROVATA: estetica newspaper NON compromette
  requirements:
    items:
      - contrast
      - screen_reader
      - font_scaling
      - keyboard
      - focus
      - reduced_motion
  typography:
    avoid:
      items:
        - font_troppo_piccoli
        - line_height_insufficiente
        - colonne_strette
        - contrasto_insufficiente
  colorBlindness:
    rule: NON usare colore come unico indicatore
  graphAlternative:
    rule: alternativa testuale per grafici importanti

ref: ui_main_v1, frontend_ui_v1/accessibility.yaml

events:
  items:
    - AccessibilityCheckPassed

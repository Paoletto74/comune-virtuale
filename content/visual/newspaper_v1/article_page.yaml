ArticlePage:
  fields:
    items:
      - titolo
      - sottotitolo
      - immagine_principale
      - didascalia
      - testo
      - timestamp
      - autore_redazione
      - eventi_correlati
      - cittadini_coinvolti_per_privacy
      - link_altre_sezioni

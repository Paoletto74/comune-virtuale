      items:
        - Vedi_proprieta
        - Apri_profilo
        - Partecipa_referendum
        - Vai_al_task
  rule: editorial content puo essere ingresso al gameplay

ref: related_entities.yaml, templates.yaml ArticlePage

events:
  items:
    - ArticlePageOpened

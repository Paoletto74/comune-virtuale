# =============================================================================
# CONTEXTUAL VISUALS MAIN CATALOG v1
# =============================================================================
# DECISIONE APPROVATA: ogni visual ha una funzione — NON decorativo quando puo spiegare
# Semantic visual: eventType -> visualAssetId — NON URL hardcoded
# V1: proposta architetturale — NO image generation, NO upload runtime, NO CDN
# Integra con visual_main_v1, sound_design_v1, content_system_v1 — NON li modifica
# =============================================================================

catalogId: contextual_visuals_v1
version: "1.0.0"
schemaVersion: 1

linkedSystems:
  visual: visual_main_v1
  newspaper: newspaper_v1
  frontend: frontend_ui_v1
  contentSystem: content_system_v1

principles:
  - ogni visual ha una funzione
  - visualAssetId — NO URL hardcoded — Visual System source of truth
  - semantic visual — eventType not file path
  - visual hierarchy — specific event -> entity -> category -> generic -> placeholder
  - visual + sound same event family
  - popup HIGH/CRITICAL support image, illustration, scene, character
  - fallback — NEVER broken image or empty space


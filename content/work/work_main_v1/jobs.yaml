# =============================================================================
# JOB DEFINITION — template schema (catalogo job TBD)
# =============================================================================
# DECISIONE APPROVATA: comportamento job definito in dati, non hardcoded
# =============================================================================

JobDefinition:
  jobId: string
  name: string
  categoryId: string
  tier: base | qualified | professional | management
  description: string

  requirements:
    type: RequirementGroup
    placeholderKeys: TBD
    notes: education, culture, reputation, experience, level, milestone — valori TBD

  compensation:
    baseSalary: TBD
    payFrequency: TBD
    bonusRules: TBD
    malusRules: TBD
    variableComponents: TBD

  schedule:
    defaultWorkHours: TBD
    scheduleType: full_time | part_time | flexible
    workHoursPerSession: TBD

  careerPathRef: string
  taskPoolRef: string
  qualitySystemRef: string
  leversRef: string

  effects:
    reputationEffects: TBD
    stressEffects: TBD
    experienceGain: TBD
    personalValueEffects: TBD

  availableFromLevel: TBD
  tags: []

  identity:
    uniqueTasks: true
    notes: DECISIONE APPROVATA — task coerenti con job, non generici identici


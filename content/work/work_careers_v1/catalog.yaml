principles:
  - WORK SYSTEM SOT per employment jobs applications career progression salary config
  - Work != Economy != Business
  - Work decide quanto e perche pagato - Economy esegue transazione
  - Job Type != Job Position
  - Level != Skill != Career Level
  - Client non authoritative
  - Hiring NON crea denaro automaticamente
  - Integra work_main_v1 - NON lo modifica
  - NO real employment NO real money


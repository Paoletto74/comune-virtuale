    publicVisibility: object
    avatarRef: string
    displayInformation: object
    titles: []
    showcase: object
    publicStatistics: object
    publicFacts: []

visibility:
  DECISIONE APPROVATA: PUBLIC, PRIVATE, DISCOVERABLE

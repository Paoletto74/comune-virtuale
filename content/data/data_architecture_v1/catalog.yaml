# =============================================================================
# DATA ARCHITECTURE & PERSISTENCE MAIN CATALOG v1
# =============================================================================
# DECISIONE APPROVATA: separare Persistent / Derived / Content / Runtime / Cache
# Definisce: entity boundaries, source of truth, consistency, contracts
# V1: proposta architetturale — NO database runtime, NO backend
# Scale target: 10 giocatori + 10.000 NPC iniziali, estendibile
# =============================================================================

catalogId: data_architecture_v1
version: "1.0.0"
schemaVersion: 1

linkedSystems:
  auth: auth_main_v1
  profile: profile_main_v1
  economy: economy_main_v1
  banking: banking_main_v1
  inventory: inventory_main_v1
  property: property_main_v1
  mobility: mobility_main_v1
  marketplace: marketplace_main_v1
  task: task_main_v1
  eventSystem: event_main_v1
  notification: notification_main_v1
  progressionMain: progression_main_v1
  social: social_main_v1
  political: political_main_v1
  criminal: criminal_main_v1
  business: business_main_v1
  family: family_main_v1
  npc: npc_main_v1
  timeSystem: time_main_v1
  visual: visual_main_v1
  ui: ui_main_v1
  adminContentStudio: admin_content_studio_v1

principles:
  - Persistent ≠ Derived ≠ Content ≠ Runtime ≠ Cache
  - Definition vs Instance — content separate from game state
  - Source of truth per dominio — NO duplicazione inutile
  - Projections/materialized views quando duplicazione per performance
  - Ledger append-oriented — transazioni non riscritte arbitrariamente
  - Atomic operations — purchase, loan, gift, salary
  - Idempotency — operazioni economiche
  - Server authoritative — client non scrive balance/level/ranking
  - Repository → Domain → API → UI — NO UI direct DB
  - Admin Studio modifica CONTENT — NON game state arbitrario
  - CODE DEPLOY ≠ CONTENT PUBLISH ≠ DATA MIGRATION
  - DEV/STAGING/PRODUCTION dati separati


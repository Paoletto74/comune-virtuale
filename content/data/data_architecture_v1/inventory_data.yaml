# =============================================================================
# INVENTORY DATA — definition vs instance
# =============================================================================

ItemDefinition:
  type: CONTENT
  sourceOfTruth: ContentStore/Inventory definitions
  schema:
    itemId: string
    contentId: string
    schemaVersion: number

ItemInstance:
  type: PERSISTENT
  sourceOfTruth: Inventory
  schema:
    instanceId: string
    itemId: string
    ownerId: string
    condition: TBD
    acquisition: object
    currentValue: TBD
    metadata: object
    status: TBD

ref: inventory_main_v1/definitions.yaml, instances.yaml

events:
  items:
    - ItemInstanceCreated
    - ItemInstanceTransferred

# =============================================================================
# EVENT CONSUMERS — async processing by domain
# =============================================================================

EventConsumers:
  status: PROPOSTA TECNICA
  consumers:
    items:
      - Notifications
      - Gazzetta
      - Rankings
      - Progression
      - Social
      - Analytics
      - Municipality
      - NPC

duplicateHandling:

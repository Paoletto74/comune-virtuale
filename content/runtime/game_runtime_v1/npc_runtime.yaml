# =============================================================================
# NPC RUNTIME — batch, aggregation, fidelity tiers
# =============================================================================

NpcRuntime:
  rule: NON eseguita necessariamente ogni tick
  modes:
    items:
      - high_level_simulation
      - batch
      - aggregation

playerVsNpc:
  player: interactive commands
  npc: simulation — regole compatibili dove possibile

priority:
  status: PROPOSTA TECNICA
  rule: NPC rilevanti = higher fidelity — NPC secondari = lower fidelity

populationUpdate:
  modes: [exact, sampled, aggregated]

sourceOfTruth: NPC
executionMode: BATCH tick
ref: npc_main_v1

events:
  emits: [NpcSimulationBatchCompleted]
  consumes: [GameTimeAdvanced]

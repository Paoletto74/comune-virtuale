  business: business_main_v1
  family: family_main_v1
  social: social_main_v1
  visual: visual_main_v1

principles:
  - NO one giant game loop — Runtime Orchestrator coordina domain systems
  - Time System = source of truth game clock — NO secondo clock indipendente
  - Server authoritative — client clock NON e source of truth
  - Tick-driven + Event-driven — non forzare un solo modello
  - Player commands immediate — non aspettano necessariamente tick
  - At-least-once + idempotency — NON exactly-once infrastrutturale
  - Financial/ownership = atomic — rankings/analytics = eventual consistency OK
  - L25 != Mayor — Political System determina ruolo
  - AI NON modifica Game State — content via Admin Studio
  - Deterministic dove possibile — controlled randomness per critical outcomes


# =============================================================================
# GAME RUNTIME MAIN CATALOG v1
# =============================================================================
# DECISIONE APPROVATA: Runtime Orchestrator coordina sistemi indipendenti
# NO "ONE GIANT GAME LOOP" — V1 proposta architetturale, NO runtime implementato
# Server authoritative, idempotent, modular, fault tolerant
# =============================================================================

catalogId: game_runtime_v1
version: "1.0.0"
schemaVersion: 1

linkedSystems:
  timeSystem: time_main_v1
  eventSystem: event_main_v1
  npc: npc_main_v1
  dataArchitecture: data_architecture_v1
  backend: backend_architecture_v1
  frontend: frontend_ui_v1
  adminContentStudio: admin_content_studio_v1

      - criminal_main_v1
      - npc_main_v1
      - time_main_v1

  contentVsCode:
    DECISIONE APPROVATA:
    allowed:
      example: |
        Nuovo task: Consegna una pizza. Ricompensa: TBD.
    notAllowed:
      example: Modifica il codice del Task Engine.

  workflowDiagram:
    status: esempio dimostrativo
    flow: |
      ChatGPT → YAML/JSON
      → Admin Paste Import
      → Validation (errors/warnings)
      → Preview (mock player)
      → Approval (if sensitive)
      → Publish
      → Cache Invalidation
      → Hot Content Active in Game

  contentPackNote: |
    admin_content_studio_v1 — layer amministrativo sopra tutti i pack.
    NO pannello runtime V1. Pack approvati NON modificati.

  dataContracts:
    ContentObject:
      contentId: string
      contentType: string
      schemaVersion: number
      version: string
      status: string
      payload: object
    ValidationResult:
      valid: boolean
      errors: []
      warnings: []
    PublishResult:
      contentId: string
      version: string
      publishedAt: timestamp
      cacheInvalidated: boolean

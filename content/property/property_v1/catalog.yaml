principles:
  - PROPERTY SYSTEM SOT per identity ownership occupancy rental valuation
  - Property != Economy != Marketplace != City
  - Housing != Ownership - primary residence separate
  - Purchase/rent atomic - mai denaro senza property o viceversa
  - Property NON e liquidita
  - Economy esegue pagamenti - Property decide condizioni
  - Integra property_main_v1 - NON lo modifica
  - Mortgage/eviction NON V1 senza regole esplicite


principles:
  - Server authoritative — client NON autorevole
  - Account != Citizen != Profile != Admin Identity
  - Default authorization = DENY
  - Content != Game State — Definition != Instance
  - Ogni dominio mantiene Source of Truth
  - Operazioni multi-dominio critiche = atomiche
  - Admin Content Studio modifica CONTENT — NON game state arbitrario
  - CODE DEPLOY != CONTENT PUBLISH != DATA MIGRATION
  - DEV/STAGING/PRODUCTION separati
  - Frontend = UNTRUSTED CLIENT


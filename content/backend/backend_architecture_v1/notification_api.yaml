# =============================================================================
# NOTIFICATION API
# =============================================================================

NotificationApi:
  sourceOfTruth: NotificationService
  endpoints:
    queries:
      items:
        - "GET /api/v1/notifications"
        - "GET /api/v1/notifications/unread-count"
        - "GET /api/v1/notifications/popup-candidates"
    commands:
      items:
        - "POST /api/v1/notifications/:notificationId/read"
        - "POST /api/v1/notifications/:notificationId/dismiss"

popup:
  rule: popup NON bypassa Notification Service

pagination: required

events:
  items:
    - NotificationApiRequestProcessed

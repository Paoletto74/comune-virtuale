# =============================================================================
# NPC SIMULATION — batch, partial, aggregated
# =============================================================================

NpcSimulationService:
  status: PROPOSTA TECNICA
  modes:
    items:
      - batch
      - partial
      - aggregated

rule: |
  NON bloccare API interattive.
  NON simulare ogni dettaglio di ogni NPC ogni secondo.

ref: npc_main_v1, data_architecture_v1/npc_data.yaml

events:
  items:
    - NpcSimulationBatchCompleted

  contentSystem: content_system_v1
  contextualVisuals: contextual_visuals_v1
  soundDesign: sound_design_v1
  frontend: frontend_ui_v1
  contracts: contracts_v1

principles:
  - citta popolata e viva — NON solo player, edifici, menu, numeri
  - PLAYER CITIZEN != NPC != BUSINESS != ORGANIZATION != INSTITUTION
  - NPC != BOT PLAYER — simulation LOD per ruolo
  - client visualizza state — NON simula truth
  - domain systems source of truth — NON duplicare Social/Economy/Work
  - aggregation + LOD — NON simulare milioni di entities


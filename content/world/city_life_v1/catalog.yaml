# =============================================================================
# CITY LIFE MAIN CATALOG v1
# =============================================================================
# DECISIONE APPROVATA: separare PLAYER CITIZEN, NPC, BUSINESS, ORGANIZATION, INSTITUTION
# Client NON simula economic/social truth — server-side authoritative
# V1: proposta architetturale — NO NPC AI runtime, NO LLM, NO database
# Integra con city_v1, profile, business, work, social — NON li modifica
# =============================================================================

catalogId: city_life_v1
version: "1.0.0"
schemaVersion: 1

linkedSystems:
  city: city_v1
  auth: auth_main_v1
  profile: profile_main_v1
  onboarding: onboarding_v1
  political: political_main_v1
  economy: economy_main_v1
  work: work_main_v1

  municipalitySystem: administrative/political entity, population, mayor, treasury
  domainSystems: economy, work, property, crime, events — authoritative logic
  backend: access, travel time/cost, ownership, dynamic state
  frontend: map UI, location cards — NOT authority

alignsWith:

  soundDesign: sound_design_v1
  frontend: frontend_ui_v1
  contracts: contracts_v1

principles:
  - City = ambiente persistente significativo — NON decorazione grafica
  - City != Municipality
  - client NON authority — access, travel, ownership backend
  - Game Location != GPS reale
  - domain systems own logic — city world does NOT duplicate Economy/Political/Crime
  - content-driven descriptions — visualAssetId — NO hardcoded URLs
  - map accessible via list/search/cards — NOT map-only


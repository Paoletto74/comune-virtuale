# =============================================================================
# CITY / WORLD STRUCTURE MAIN CATALOG v1
# =============================================================================
# DECISIONE APPROVATA: City != Municipality — City = ambiente, Municipality = amministrativo
# Client NON authority su access, travel, ownership — backend authoritative
# V1: proposta architetturale — NO map runtime, NO GPS, NO routing engine
# Integra con political, property, mobility, work, event, npc — NON li modifica
# =============================================================================

catalogId: city_v1
version: "1.0.0"
schemaVersion: 1

linkedSystems:
  political: political_main_v1
  property: property_main_v1
  mobility: mobility_main_v1
  work: work_main_v1
  business: business_main_v1

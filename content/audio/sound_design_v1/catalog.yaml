# =============================================================================
# SOUND DESIGN MAIN CATALOG v1
# =============================================================================
# DECISIONE APPROVATA: audio significativo, non decorativo optional
# Semantic audio: eventType -> soundAssetId — NON backend invia "play siren.mp3"
# V1: proposta architetturale — NO audio runtime, NO file audio, NO engine
# Integra con notification, event, economy, newspaper, contracts — NON li modifica
# =============================================================================

catalogId: sound_design_v1
version: "1.0.0"
schemaVersion: 1

linkedSystems:
  notification: notification_main_v1
  event: event_main_v1
  economy: economy_main_v1
  progression: progression_main_v1
  criminal: criminal_main_v1
  political: political_main_v1
  newspaper: newspaper_v1
  frontend: frontend_ui_v1
  visual: visual_main_v1
  contracts: contracts_v1
  contentSystem: content_system_v1
  auth: auth_main_v1

principles:
  - audio significativo — feedback, immersione, identita editoriale
  - gerarchia sonora — NON un suono per ogni azione
  - semantic audio — backend comunica evento semantico, audio layer decide riproduzione
  - backend authority — frontend NON inventa eventi authoritative
  - accessibility — nessuna info critica solo via suono
  - gameplay integrity — disattivare audio NON cambia reward/outcome/timing


principles:
  - ECONOMY SYSTEM SOT per saldi transazioni emissione distruzione debiti
  - Nessun altro sistema modifica direttamente un saldo
  - Economy != Marketplace != Bank
  - Ogni mutazione via Transaction + Ledger
  - Money transfer != money creation
  - Double-entry ledger PROPOSTA TECNICA fortemente raccomandata
  - Integer minor units - NO floating point authoritative
  - Client non authoritative - NO POST set-balance
  - Integra economy_main_v1 - NON lo modifica
  - V1 NO real money


responsibilitySplit:
  frontendDecides:
    items:
      - presentation
      - navigation
      - interaction
      - responsive_layout
      - loading_error_states
      - visual_composition
      - client_side_cache
      - ui_state
  backendDecides:
    items:
      - game_state
      - rules
      - permissions
      - ownership
      - calculations
      - transactions
      - authoritative_outcomes
  contentSystemDecides:
    items:
      - published_texts
      - labels
      - task_definitions
      - item_definitions
      - news
      - event_content
      - notification_templates
  visualSystemDecides:
    items:
      - assets
      - visual_references
      - asset_metadata

alignsWith:
  note: |
    Formalizza UI shell e navigation coerente con ui_main_v1 e backend_architecture_v1.
    NON modifica pack approvati. NON implementa runtime.

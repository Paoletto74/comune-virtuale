# =============================================================================
# FRONTEND UI SHELL & NAVIGATION MAIN CATALOG v1
# =============================================================================
# DECISIONE APPROVATA: frontend UNTRUSTED CLIENT — presentation only
# V1: proposta architetturale — NO frontend runtime, NO framework, NO PWA
# Ref: ui_main_v1 (design system source of truth)
# =============================================================================

catalogId: frontend_ui_v1
version: "1.0.0"
schemaVersion: 1

linkedSystems:
  uiMain: ui_main_v1
  visual: visual_main_v1
  profile: profile_main_v1
  backend: backend_architecture_v1
  dataArchitecture: data_architecture_v1
  auth: auth_main_v1
  notification: notification_main_v1
  task: task_main_v1
  work: work_main_v1
  marketplace: marketplace_main_v1
  banking: banking_main_v1
  social: social_main_v1
  political: political_main_v1
  progressionMain: progression_main_v1
  adminContentStudio: admin_content_studio_v1

principles:
  - Frontend = UNTRUSTED CLIENT — presentation, navigation, interaction
  - Backend = authority on game state, rules, permissions, calculations
  - Content System = published texts, labels, definitions
  - Visual System = assets, visual references
  - NO business rules in frontend
  - NO hardcoded gameplay values (rewards, prices, thresholds)
  - Content-driven UI where possible
  - Mobile-first responsive
  - Admin UI separate from Player UI

includes:
  appShell: app_shell.yaml
  routing: routing.yaml
  header: header.yaml
  bottomNavigation: bottom_navigation.yaml
  home: home.yaml
  gazzetta: gazzetta.yaml
  referendum: referendum.yaml

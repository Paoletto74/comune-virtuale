  visualAssets: visual_assets.yaml
  imageFallbacks: image_fallbacks.yaml
  responsive: responsive.yaml
  accessibility: accessibility.yaml
  sound: sound.yaml
  themes: themes.yaml
  designTokens: design_tokens.yaml
  components: components.yaml
  dataFetching: data_fetching.yaml
  clientCache: client_cache.yaml
  realtime: realtime.yaml
  offline: offline.yaml
  pwa: pwa.yaml
  apiClient: api_client.yaml

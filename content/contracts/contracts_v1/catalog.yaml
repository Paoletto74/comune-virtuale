  applicationLayer: [orchestration, authorization, transaction_boundaries, cross_domain_workflows]
  queryReadModelLayer: [projections, summaries, historical_data, cache]
  eventInfrastructure: [delivery, retry, ordering, deduplication]
  api: [external_dto, auth, request_response_mapping]

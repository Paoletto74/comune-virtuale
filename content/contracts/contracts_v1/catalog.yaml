# =============================================================================
# CONTRACTS MAIN CATALOG v1
# =============================================================================
# GAME STATE + COMMANDS + QUERIES + DOMAIN EVENTS contracts
# V1: proposta architetturale — NO runtime, NO API, NO database, NO event bus
# Evita chiamate caotiche cross-domain — contract espliciti
# =============================================================================

catalogId: contracts_v1
version: "1.0.0"
schemaVersion: 1

linkedSystems:
  dataArchitecture: data_architecture_v1
  backend: backend_architecture_v1
  frontend: frontend_ui_v1
  gameRuntime: game_runtime_v1
  auth: auth_main_v1
  banking: banking_main_v1
  economy: economy_main_v1
  inventory: inventory_main_v1
  marketplace: marketplace_main_v1
  work: work_main_v1
  task: task_main_v1
  progressionMain: progression_main_v1
  political: political_main_v1
  criminal: criminal_main_v1
  social: social_main_v1
  profile: profile_main_v1
  notification: notification_main_v1
  visual: visual_main_v1
  adminContentStudio: admin_content_studio_v1
  timeSystem: time_main_v1

principles:
  - Ogni dato ha un unico owner autorevole
  - AUTHORITATIVE != DERIVED != CACHE
  - Domain A NON accede DB di Domain B — Command/Query/Event/Application Contract
  - Command = imperative — Event = past tense — Query = read only
  - Client NON autorevole per price/reward/level/ownership/role
  - Idempotency su commands critici
  - Events immutabili — correzione via nuovo event
  - Data minimization — NO secrets in payloads


# =============================================================================
# CONTENT SYSTEM MAIN CATALOG v1
# =============================================================================
# DECISIONE APPROVATA: GAME LOGIC != GAME CONTENT
# Admin Authoring != Admin Access Direct to Game State
# V1: proposta architetturale — NO Admin runtime, NO database, NO API, NO AI runtime
# Integra con admin_content_studio_v1, contracts_v1, newspaper_v1 — NON li modifica
# =============================================================================

catalogId: content_system_v1
version: "1.0.0"
schemaVersion: 1

linkedSystems:
  adminContentStudio: admin_content_studio_v1
  auth: auth_main_v1
  contracts: contracts_v1
  newspaper: newspaper_v1
  visual: visual_main_v1
  dataArchitecture: data_architecture_v1
  backend: backend_architecture_v1
  gameRuntime: game_runtime_v1

principles:
  - GAME LOGIC != GAME CONTENT
  - Admin Authoring != Direct Game State modification
  - Domain Systems own game logic — Content System owns editorial content
  - Draft -> Validation -> Preview -> Approval -> Publish
  - GitHub NON obbligatorio per contenuti quotidiani
  - AI Draft -> Validation -> Approval -> Publish — MAI publish diretto
  - Player receives published content only — NO drafts
  - publishAt/expireAt use Game Time — NOT device clock


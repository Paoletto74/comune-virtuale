# =============================================================================
# ADMIN PREVIEW — desktop, tablet, mobile, game context
# =============================================================================

AdminPreview:
  viewports:
    items:
      - Desktop
      - Tablet
      - Mobile
  newspaper:
    items:
      - FrontPage
      - Article
      - Card
  gameContext:
    items:
      - Home
      - Gazzetta
      - Notification
      - Popup
      - Marketplace_card
      - Profile_card

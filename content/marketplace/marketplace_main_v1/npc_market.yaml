# =============================================================================
# NPC MARKET — supply, demand, aggregate transactions
# =============================================================================

NpcDemand:
  DECISIONE APPROVATA: |
    NPC System fornisce: domanda, segmenti, budget, preferenze.
    Marketplace usa per matching.
  ref: npc_main_v1/consumption, npc_main_v1/employment

NpcSupply:
  status: PROPOSTA TECNICA
  rule: |
    NPC possono offrire beni, immobili, veicoli, servizi.
    Popolazione aggregata → supply simulation — non tutti listing individuali.

AggregateMarketDemand:
  DECISIONE APPROVATA: |
    NON 10.000 ordini individuali se non necessario.
  example:
    product: food_basic
    unitsRequested: TBD
    averagePrice: TBD

ImportantNpcTransactions:
  DECISIONE APPROVATA: |
    NPC rilevanti (TIER 2/3) → transazione individuale persistente.
    Es. NPC importante acquista casa giocatore.

npcBuyerEvaluation:
  factors:
    items:
      - availability
      - price
      - demand
      - economic_segment
      - preferences
  economyAuthorizes: true

events:
  items:
    - AggregateDemandUpdated
    - NpcPurchaseCompleted
    - NpcListingCreated

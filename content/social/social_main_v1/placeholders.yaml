  security:
    DECISIONE APPROVATA: client NON può
    clientCannot:
      items:
        - send_arbitrary_text
        - modify_messageDefinition
        - falsify_sender
        - falsify_recipient
        - modify_social_score
        - modify_relationship
        - bypass_cooldown
        - generate_unauthorized_interactions

  audit:
    DECISIONE APPROVATA:
    fields:
      items:
        - interactionId
        - actorId
        - targetId
        - messageDefinitionId
        - actionType
        - timestamp
        - worldTime
        - source
        - outcome

  idempotency:
    DECISIONE APPROVATA: proteggere contro
    threats:
      items:
        - double_send
        - double_reward
        - double_relationship_change
        - replay
        - race_conditions

  offline:
    DECISIONE APPROVATA: |
      Durante offline: interazioni, regali, prestiti, preset messages, conseguenze sociali.
      Al login: catch-up → events → notifications.

  performance:
    status: PROPOSTA TECNICA
    uses:

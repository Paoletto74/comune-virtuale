WorkIntegration:
  status: PROPOSTA TECNICA

  extends: social_main_v1/integrations.yaml — work_main_v1

  boundary:
    workOwns:
      items:
        - employment
        - salary
        - promotion
        - work_state
        - schedule
    socialProvides:
      items:
        - employer_employee_preset_messages
        - congratulation
        - rivalry
        - colleague_interaction

  workEventsMayTrigger:

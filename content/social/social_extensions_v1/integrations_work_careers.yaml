      - hired_congratulation
      - promotion_congratulation
      - rivalry_at_work
      - resignation_message
      - performance_reaction

  note: |
    employer/employee relationship potrebbe restare Work-owned.
    Social status enum approvato NON include employer/employee — TBD.

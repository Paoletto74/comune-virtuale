principles:
  - TIME SYSTEM source of truth per Game Time
  - REAL TIME != GAME TIME - server authoritative
  - Time decide QUANDO - domini decidono COSA
  - NON orologi indipendenti nei singoli sistemi
  - Client visualizza - NON modifica Game Time
  - NON reset giornaliero unico arbitrario
  - Integra time_main_v1 - NON lo modifica


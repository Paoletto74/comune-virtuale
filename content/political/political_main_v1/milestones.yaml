# =============================================================================
# POLITICAL MILESTONES
# =============================================================================

PoliticalMilestone:
  schema:
    milestoneId: string
    label: string
    description: string
    triggerConditionsRef: string
    visibility: PUBLIC | PRIVATE | DISCOVERABLE
    unlocksRef: string | null

milestones:
  status: skeleton_narrative_only
  indicativeExamples:
    items:
      - milestoneId: FIRST_CANDIDACY
        label: Prima candidatura
        visibility: PUBLIC
      - milestoneId: FIRST_ELECTION_WIN
        label: Prima elezione vinta
        visibility: PUBLIC
      - milestoneId: FIRST_MANDATE
        label: Primo mandato
        visibility: PUBLIC
      - milestoneId: REELECTION
        label: Rielezione
        visibility: PUBLIC
      - milestoneId: FIRST_LAW
        label: Prima legge
        visibility: PUBLIC
      - milestoneId: HIGH_SUPPORT
        label: Grande consenso
        visibility: PUBLIC
      - milestoneId: POLITICAL_CRISIS
        label: Grande crisi
        visibility: DISCOVERABLE
      - milestoneId: ROLE_LOST
        label: Perdita del ruolo
        visibility: PUBLIC
      - milestoneId: HISTORIC_MANDATE
        label: Mandato storico
        visibility: PUBLIC
  names: TBD

integration:
  progression_main_v1:
    trackId: political
  politicalSystem:
    contributesTo: politicalTrack_progression

events:
  items:
    - PoliticalMilestoneReached

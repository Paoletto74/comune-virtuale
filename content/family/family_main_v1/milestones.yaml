# =============================================================================
# FAMILY MILESTONES
# =============================================================================

FamilyMilestone:
  schema:
    milestoneId: string
    label: string
    description: string
    triggerConditionsRef: string
    visibility: PUBLIC | PRIVATE

milestones:
  status: skeleton_narrative_only
  indicativeExamples:
    items:
      - milestoneId: FIRST_PARTNER
        label: Primo partner
        visibility: PUBLIC
      - milestoneId: COHABITATION
        label: Convivenza
        visibility: PUBLIC
      - milestoneId: FIRST_CHILD
        label: Primo figlio
        visibility: PUBLIC
      - milestoneId: CHILD_ADULT
        label: Figlio adulto
        visibility: PUBLIC
      - milestoneId: LARGE_FAMILY
        label: Famiglia numerosa
        visibility: PUBLIC
      - milestoneId: STRONG_FAMILY_SUPPORT
        label: Grande supporto familiare
        visibility: PRIVATE
  names: TBD

progressionIntegration:
  note: Milestone familiari — NON obbligatori per mainLevel
  contributesTo: wellbeing_context — TBD

events:
  items:
    - FamilyMilestoneReached

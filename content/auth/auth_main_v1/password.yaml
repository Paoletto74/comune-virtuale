# =============================================================================
# USERNAME + PASSWORD
# =============================================================================

PasswordAuthentication:
  DECISIONE APPROVATA: username + password supportati
  schema:
    username: string
    passwordHash: string
    passwordPolicy: object
  rules:
    items:
      - NO_password_in_chiaro
      - hash_algorithm_TBD
      - NO_mostrare_password

passwordSecurity:
  status: PROPOSTA TECNICA
  includes:
    items:
      - password_hash
      - password_strength
      - rate_limiting
      - failed_attempt_handling
      - recovery

events:
  items:
    - PasswordLoginSucceeded
    - PasswordLoginFailed

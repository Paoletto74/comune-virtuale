principles:
  - Landing -> Authentication -> Account -> Citizen Creation -> Personalization -> Introduction -> First Game Experience -> Home
  - Account != Citizen — frontend NON decide CitizenId, money, level, ownership
  - onboarding resume — NON perdere dati gia salvati
  - tutorial breve — NON interminabile — skippabile
  - privacy by default — info personali PRIVATE
  - content-driven texts — NON hardcodare editoriali
  - Game Time per date mostrate


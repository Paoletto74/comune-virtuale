# =============================================================================
# ONBOARDING MAIN CATALOG v1
# =============================================================================
# Player Entry: Landing -> Auth -> Account -> Citizen Creation -> Home
# DECISIONE APPROVATA: Account != Citizen != Profile
# Frontend raccoglie dati — Backend crea Citizen authoritative
# V1: proposta architetturale — NO OAuth runtime, NO database, NO frontend runtime
# Estende auth_main_v1 — NON lo modifica
# =============================================================================


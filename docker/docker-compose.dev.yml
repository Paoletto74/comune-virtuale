services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: comune
      POSTGRES_PASSWORD: dev_only
      POSTGRES_DB: comune_virtuale_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U comune -d comune_virtuale_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
